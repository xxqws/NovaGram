<style>
:root{--bg:#eff7e8;--card:#e3ebdc;--card2:#dbe3d4;--hi:#d3dbcc;--tx:#181e13;--tx2:#44483f;--ac:#476b13;--onac:#fff;--pc:#c8f39d;--opc:#0d2000;--sc:#d9e9ca;--osc:#131f0b;--ol:#74796d;--ov:#c4c8bb;--er:#ba1a1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;margin:0;background:var(--bg);color:var(--tx);font-family:"Golos Text","Google Sans",Roboto,system-ui,-apple-system,sans-serif;font-size:16px}
body{overflow:hidden}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
#app{position:relative;max-width:520px;height:100%;margin:0 auto;overflow:hidden;background:var(--bg);padding-top:env(safe-area-inset-top,0)}
.scr{position:absolute;inset:0;overflow-y:auto;padding:12px 16px 120px}
.ttl{display:flex;align-items:center;justify-content:space-between;font-size:32px;margin:12px 4px 16px;min-height:48px}
.pf{width:48px;height:48px;border-radius:50%;background:var(--pc);color:var(--opc);font-size:20px;font-weight:500;display:grid;place-items:center}
.srch{display:block;width:100%;height:56px;border:0;border-radius:28px;background:var(--card);padding:0 22px;font-size:16px;outline:none;margin-bottom:14px}
.srch::placeholder,.fld input::placeholder{color:var(--tx2);opacity:.7}
.list{background:var(--card);border-radius:32px;padding:8px}
.it{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:24px;cursor:pointer}
.it:active{background:var(--card2)}
.av{width:52px;height:52px;border-radius:50%;background:var(--pc);color:var(--opc);display:grid;place-items:center;font-size:20px;font-weight:500;flex:none}
.it .t{flex:1;min-width:0}
.it b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it small{display:block;color:var(--tx2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.it .r{text-align:right;font-size:12px;color:var(--tx2);display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.bd{background:var(--ac);color:var(--onac);border-radius:11px;min-width:22px;height:22px;line-height:22px;padding:0 7px;text-align:center;font-weight:500}
.emp{text-align:center;color:var(--tx2);padding:56px 24px}
.emp i{display:grid;place-items:center;width:96px;height:96px;margin:0 auto 18px;border-radius:32px;background:var(--pc);color:var(--opc)}
nav{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0));height:76px;border-radius:32px;background:var(--card);display:flex;justify-content:space-around;align-items:center;z-index:5}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--tx2);min-width:84px}
nav svg,.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav svg{box-sizing:content-box;padding:4px 20px;border-radius:16px;transition:background .25s}
nav .on{color:var(--tx)}
nav .on svg{background:var(--pc);color:var(--opc)}
.fab{position:absolute;right:20px;bottom:104px;z-index:4;display:flex;align-items:center;gap:12px;height:60px;padding:0 22px;border-radius:20px;background:var(--pc);color:var(--opc);font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.fab:active,.btn:active{transform:scale(.96)}
.btn{display:block;width:100%;height:54px;border-radius:27px;background:var(--ac);color:var(--onac);font-weight:500;margin-top:14px}
.btn.t2{background:var(--sc);color:var(--osc)}
.btn.tx{background:none;color:var(--ac)}
.btn[disabled]{opacity:.5}
.card{background:var(--card);border-radius:32px;margin-bottom:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:16px;padding:16px 22px;cursor:pointer}
.row+.row{border-top:1px solid var(--ov)}
.row .t{flex:1}.row b{display:block;font-weight:500}.row small{color:var(--tx2);font-size:14px}
.ico{width:42px;height:42px;border-radius:50%;background:var(--sc);color:var(--osc);display:grid;place-items:center;flex:none}
.sec{font-size:14px;font-weight:500;color:var(--ac);margin:22px 14px 8px}
.seg{display:flex;margin:6px 18px 14px;border:1px solid var(--ol);border-radius:20px;overflow:hidden}
.seg button{flex:1;height:40px;font-size:14px;font-weight:500}
.seg .on{background:var(--sc);color:var(--osc)}
.sw{display:flex;gap:12px;flex-wrap:wrap;padding:6px 18px 18px}
.sw button{width:44px;height:44px;border-radius:50%;border:3px solid transparent}
.sw .on{border-color:var(--tx)}
.pg{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:68px}
.bar .av{width:44px;height:44px;font-size:18px}
.bar b{flex:1;font-size:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--tx2)}
.ib:active{background:var(--card2)}
#ml{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:4px}
.m{max-width:80%;padding:10px 15px;border-radius:22px 22px 22px 6px;background:var(--card2);align-self:flex-start;word-wrap:break-word;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--pc);color:var(--opc);border-radius:22px 22px 6px 22px}
.m small{display:block;font-size:11px;opacity:.65;text-align:right;margin-top:2px}
.day{align-self:center;font-size:12px;color:var(--tx2);margin:10px 0 4px}
.cmp{display:flex;gap:8px;align-items:center;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0))}
.cmp input{flex:1;height:54px;border:0;border-radius:27px;background:var(--card);padding:0 22px;outline:none}
.send{width:54px;height:54px;border-radius:50%;background:var(--ac);color:var(--onac);display:grid;place-items:center}
.auth{position:absolute;inset:0;overflow-y:auto;padding:48px 24px 32px}
.auth h1{font-size:36px;font-weight:400;margin:24px 0 8px}
.auth p{color:var(--tx2);margin:0 0 24px}
.logo{width:72px;height:72px;border-radius:24px;background:var(--pc);color:var(--opc);display:grid;place-items:center}
.logo svg{width:36px;height:36px}
.fld{display:block;margin-bottom:14px}
.fld span{display:block;font-size:13px;color:var(--tx2);margin:0 0 6px 16px}
